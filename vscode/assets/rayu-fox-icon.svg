  Uses solid filled paths (no fragile hairlines) with vibrant Rayu violet fill:
  - In VS Code Activity Bar / Secondary Sidebar CSS mask mode, VS Code uses the
    alpha channel and tints the silhouette to active theme foreground (bright on
    Dark themes, dark on Light themes, high contrast in HC themes).
  - If rendered directly without a mask, #6D28D9 maintains strong contrast on
    both Dark (#1E1E1E) and Light (#F3F3F3) VS Code surfaces.
-->
