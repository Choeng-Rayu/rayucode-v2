name: RayuCode Desktop CI

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "DESIGN.md"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "DESIGN.md"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-ci.yml"

jobs:
  verify-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install desktop dependencies
        run: pnpm --filter @rayu-dev/rayucode-desktop install --frozen-lockfile || pnpm --filter @rayu-dev/rayucode-desktop install
      - name: Run full desktop verification gates
        working-directory: desktop
        run: pnpm verify
