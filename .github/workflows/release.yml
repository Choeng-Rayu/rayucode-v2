name: Release

env:
  RAYU_CI: "1"
  RAYU_CI_BUILD: "1"
  RAYU_RELEASE_BUILD: "1"
  RAYU_USE_PLAIN_CARGO: "1"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  ENABLE_OTHER_PROVIDER: ${{ vars.ENABLE_OTHER_PROVIDER || 'false' }}
  RAYU_FALLBACK_MODEL: ${{ vars.RAYU_FALLBACK_MODEL || 'deepseek-v4.1-flash-1017-cloud' }}
  # CI builds without the local parallel-frontend rustc wrapper from .cargo/config.toml.
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (vMAJOR.MINOR.PATCH, e.g. v3.0.0)
        required: true
        type: string
  push:
    tags:
      - 'v*'
      - '!v*-preview.*'

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Validate tag & release configuration
    if: github.repository == 'Choeng-Rayu/rayucode-v2' && !contains(inputs.tag || github.ref_name, '-preview.')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag_sha: ${{ steps.validate.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and Cargo.toml version
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release tag '$RELEASE_TAG' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          }
          tag_sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$tag_sha" != "${GITHUB_SHA}" ]; then
            echo "::error::Tag ${RELEASE_TAG} (${tag_sha}) does not match triggering commit (${GITHUB_SHA})"
            exit 1
          fi
          git checkout --detach "$tag_sha"
          cargo_version=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')
          expected_version="${RELEASE_TAG#v}"
          if [ "$cargo_version" != "$expected_version" ]; then
            echo "::error::Cargo.toml version ($cargo_version) does not match tag ($RELEASE_TAG)"
            exit 1
          fi
          echo "Validated tag ${RELEASE_TAG} at ${tag_sha} (Cargo.toml version ${cargo_version})"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify frozen Cargo.lock and installer tests
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 >/dev/null
          git diff --exit-code -- Cargo.lock
          bash -n scripts/install.sh scripts/uninstall.sh scripts/build_linux_compat.sh
          bash scripts/test_install_conversion.sh
          bash scripts/test_legacy_migration.sh
          bash scripts/setup_friction_eval.sh

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NUM="${RELEASE_TAG#v}"
          CHANGELOG_FILE="changelog/v${VERSION_NUM}.json"
          if [ -f "$CHANGELOG_FILE" ]; then
            python3 - "$RELEASE_TAG" "$CHANGELOG_FILE" << 'PY' > release_notes.md
          import json, pathlib, sys
          tag, path = sys.argv[1], pathlib.Path(sys.argv[2])
          data = json.loads(path.read_text(encoding="utf-8"))
          lines = [f"# RayuCode {tag}", ""]
          if data.get("summary"):
              lines.extend([data["summary"], ""])
          for heading, key in [("Highlights", "highlights"), ("Improvements", "improvements"), ("Fixes", "fixes")]:
              items = data.get(key) or []
              if items:
                  lines.append(f"## {heading}")
                  lines.extend(f"- {item}" for item in items)
                  lines.append("")
          print("\n".join(lines).rstrip())
          PY
          else
            cat > release_notes.md <<EOF
          # RayuCode ${RELEASE_TAG}

          Official cross-platform binary release of RayuCode CLI (Rust) for Linux, macOS, and Windows.
          EOF
          fi
          cat >> release_notes.md <<EOF

          ## Install

          **Linux / macOS:**
          \`\`\`bash
          curl -fsSL https://rayucode.com/install | bash
          # or directly from GitHub:
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | bash
          \`\`\`

          **Windows (PowerShell):**
          \`\`\`powershell
          irm https://rayucode.com/install.ps1 | iex
          # or directly from GitHub:
          irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.ps1 | iex
          \`\`\`

          ## Supported Platforms
          | Platform | Architecture | Asset |
          |---|---|---|
          | Linux | x86_64 (glibc 2.17+) | \`rayu-linux-x86_64.tar.gz\` |
          | Linux | ARM64 (aarch64) | \`rayu-linux-aarch64.tar.gz\` |
          | macOS | Apple Silicon (arm64) | \`rayu-macos-aarch64.tar.gz\` |
          | macOS | Intel (x86_64) | \`rayu-macos-x86_64.tar.gz\` |
          | Windows | x64 (x86_64) | \`rayu-windows-x86_64.exe\` / \`rayu-windows-x86_64.tar.gz\` |
          | Windows | ARM64 (aarch64) | \`rayu-windows-aarch64.exe\` / \`rayu-windows-aarch64.tar.gz\` |

          ## Verify Checksums
          Every release asset is listed in \`SHA256SUMS\`. The official installers and \`rayu update\` verify SHA-256 checksums automatically before installing.
          EOF

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error

  build-unix:
    name: Build (${{ matrix.target }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: rayu-linux-x86_64
            compat_container: true
            native_linux_arm64: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: rayu-linux-aarch64
            compat_container: false
            native_linux_arm64: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rayu-macos-aarch64
            compat_container: false
            native_linux_arm64: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: rayu-macos-x86_64
            compat_container: false
            native_linux_arm64: false
    steps:
      - name: Free disk space on Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        if: matrix.compat_container != true
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - uses: Swatinem/rust-cache@v2
        if: matrix.compat_container != true
        with:
          key: release-${{ matrix.target }}
          cache-all-crates: "true"
          cache-on-failure: "true"

      - name: Cache Linux compat Docker Cargo registry & rustup
        if: matrix.compat_container == true
        uses: actions/cache@v4
        with:
          path: ~/.cache/rayu-linux-compat
          key: release-linux-compat-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-linux-compat-

      - name: Install native Linux ARM64 build prerequisites
        if: matrix.native_linux_arm64 == true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake perl pkg-config

      - name: Build portable Linux x86_64 release binary (manylinux2014 glibc 2.17)
        if: matrix.compat_container == true
        shell: bash
        run: scripts/build_linux_compat.sh dist
        env:
          RAYU_BUILD_SEMVER: ${{ env.RELEASE_TAG }}
          RAYU_COMPAT_ARTIFACT: ${{ matrix.artifact }}
          CARGO_BUILD_JOBS: "3"

      - name: Build native release binary (Linux ARM64 / macOS)
        if: matrix.compat_container != true
        shell: bash
        env:
          RAYU_BUILD_SEMVER: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1 && sccache --start-server 2>/dev/null; then
            export RUSTC_WRAPPER=sccache
          fi
          if [ "${{ matrix.native_linux_arm64 }}" = "true" ]; then
            export CARGO_BUILD_JOBS=3
            export OPENSSL_STATIC=1
            cargo build --locked --release --target "${{ matrix.target }}" \
              -p rayucode --bin rayu --features linux-compat-vendored-openssl
          else
            cargo build --locked --release --target "${{ matrix.target }}" \
              -p rayucode --bin rayu
          fi

      - name: Verify Cargo.lock unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock

      - name: Package binary, smoke-test natively & attach notices
        if: matrix.compat_container != true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/rayu" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --force --sign - --identifier com.rayucode.cli "dist/${{ matrix.artifact }}"
            codesign -dv "dist/${{ matrix.artifact }}" 2>&1 | grep -qx 'Identifier=com.rayucode.cli'
          fi
          reported=$("dist/${{ matrix.artifact }}" --no-update --no-selfdev --version)
          echo "Native smoke test: $reported"
          [[ "$reported" == "rayu ${RELEASE_TAG}"* ]] || {
            echo "::error::Expected version starting with 'rayu ${RELEASE_TAG}', got '${reported}'"
            exit 1
          }
          tar czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"
          if [ -f scripts/release_licenses.py ]; then
            license_dir="$RUNNER_TEMP/licenses"
            if [ "${{ matrix.native_linux_arm64 }}" = "true" ]; then
              python3 scripts/release_licenses.py generate "${{ matrix.target }}" "$license_dir" --features linux-compat-vendored-openssl
            else
              python3 scripts/release_licenses.py generate "${{ matrix.target }}" "$license_dir"
            fi
            python3 scripts/release_licenses.py attach "dist/${{ matrix.artifact }}.tar.gz" "$license_dir"
          fi

      - name: Attach licenses to portable Linux x86_64 archive
        if: matrix.compat_container == true
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/release_licenses.py ]; then
            license_dir="$RUNNER_TEMP/licenses"
            python3 scripts/release_licenses.py generate "${{ matrix.target }}" "$license_dir" --features linux-compat-vendored-openssl
            python3 scripts/release_licenses.py attach "dist/${{ matrix.artifact }}.tar.gz" "$license_dir"
          fi

      - name: Upload Unix release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build (${{ matrix.target }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            msvc_arch: amd64
            artifact: rayu-windows-x86_64
            cargo_args: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64
            artifact: rayu-windows-aarch64
            cargo_args: "--no-default-features --features pdf"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_sha }}
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-all-crates: "true"
          cache-on-failure: "true"

      - name: Build Windows release binary
        shell: pwsh
        env:
          RAYU_BUILD_SEMVER: ${{ env.RELEASE_TAG }}
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --start-server *> $null
            if ($LASTEXITCODE -eq 0) {
              $env:RUSTC_WRAPPER = "sccache"
            }
          }

          $cargoArgs = @("build", "--locked", "--release", "--target", "${{ matrix.target }}", "-p", "rayucode", "--bin", "rayu")
          $extraArgs = "${{ matrix.cargo_args }}"
          $features = @()
          if (-not [string]::IsNullOrWhiteSpace($extraArgs)) {
            $features = $extraArgs -split '\s+'
            $cargoArgs += $features
          }
          if (Test-Path "scripts/release_licenses.py") {
            $pythonCmd = if (Get-Command python -ErrorAction SilentlyContinue) { "python" } else { "python3" }
            & $pythonCmd scripts/release_licenses.py generate "${{ matrix.target }}" "dist/licenses" @features
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:RAYU_RELEASE_NOTICES = (Resolve-Path "dist/licenses/THIRD_PARTY_NOTICES").Path
          }

          & cargo @cargoArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Cargo.lock unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock

      - name: Validate Windows installer syntax and native binary launch
        shell: pwsh
        run: |
          foreach ($psFile in @("scripts/install.ps1", "scripts/uninstall.ps1")) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $psFile).Path,
              [ref]$null,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
          }
          $versionLines = @(& "target/${{ matrix.target }}/release/rayu.exe" --no-update --no-selfdev --version)
          $exitCode = $LASTEXITCODE
          $reported = ($versionLines | Select-Object -First 1).ToString().Trim()
          Write-Host "Native Windows smoke test: $reported (exit=$exitCode)"
          if ($exitCode -ne 0) { throw "Built Windows binary failed --version (exit $exitCode)" }
          if (-not $reported.StartsWith("rayu ${{ env.RELEASE_TAG }}")) {
            throw "Expected version starting with 'rayu ${{ env.RELEASE_TAG }}', got '$reported'"
          }

      - name: Package Windows .exe and .tar.gz
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rayu.exe" "dist/${{ matrix.artifact }}.exe" -Force
          tar czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Test-Path "scripts/release_licenses.py") -and (Test-Path "dist/licenses")) {
            $pythonCmd = if (Get-Command python -ErrorAction SilentlyContinue) { "python" } else { "python3" }
            & $pythonCmd scripts/release_licenses.py attach "dist/${{ matrix.artifact }}.tar.gz" "dist/licenses"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.exe
            dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  publish-public-release:
    name: Publish GitHub Release & checksums
    needs: [prepare-release, build-unix, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rayu-*

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: Validate complete platform asset set & generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          expected=(
            artifacts/rayu-linux-x86_64/rayu-linux-x86_64.tar.gz
            artifacts/rayu-linux-aarch64/rayu-linux-aarch64.tar.gz
            artifacts/rayu-macos-aarch64/rayu-macos-aarch64.tar.gz
            artifacts/rayu-macos-x86_64/rayu-macos-x86_64.tar.gz
            artifacts/rayu-windows-x86_64/rayu-windows-x86_64.exe
            artifacts/rayu-windows-x86_64/rayu-windows-x86_64.tar.gz
            artifacts/rayu-windows-aarch64/rayu-windows-aarch64.exe
            artifacts/rayu-windows-aarch64/rayu-windows-aarch64.tar.gz
          )
          for asset in "${expected[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing required release asset: $asset"
              exit 1
            fi
            cp "$asset" staging/
          done

          (cd staging && sha256sum rayu-* > SHA256SUMS)
          cat staging/SHA256SUMS

      - name: Publish static release metadata to release-metadata branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init metadata-repo
          cd metadata-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin release-metadata 2>/dev/null; then
            git checkout -B release-metadata FETCH_HEAD
          else
            git checkout --orphan release-metadata
          fi

          mkdir -p "releases/latest" "releases/${RELEASE_TAG}"
          printf '%s\n' "${RELEASE_TAG}" > "releases/latest/version"
          cp ../staging/SHA256SUMS "releases/${RELEASE_TAG}/SHA256SUMS"
          printf 'https://github.com/%s/releases/download/%s\n' \
            "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" > "releases/${RELEASE_TAG}/download-bases"

          git add releases/
          if ! git diff --cached --quiet; then
            git commit -m "Release metadata ${RELEASE_TAG}"
            git push origin HEAD:refs/heads/release-metadata
          fi

      - name: Create or update public GitHub Release with all assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "RayuCode ${RELEASE_TAG}" \
              --notes-file notes/release_notes.md \
              --draft=false \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "RayuCode ${RELEASE_TAG}" \
              --notes-file notes/release_notes.md \
              --latest
          fi
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            staging/rayu-* staging/SHA256SUMS \
            --clobber

  verify-public-release:
    name: Verify anonymous public downloads & installer smoke test
    needs: [prepare-release, publish-public-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify anonymous public access, checksums, and Linux installer
        shell: bash
        run: |
          set -euo pipefail
          # Explicitly run with NO GitHub token to prove public anonymous access.
          unset GITHUB_TOKEN GH_TOKEN || true

          meta_ver=""
          for attempt in 1 2 3 4 5 6; do
            meta_ver=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/release-metadata/releases/latest/version" 2>/dev/null | tr -d '\r\n' || true)
            if [ "$meta_ver" = "$RELEASE_TAG" ]; then
              break
            fi
            echo "Waiting for release-metadata CDN propagation (attempt $attempt/6, got '${meta_ver}')..."
            sleep 5
          done
          [ "$meta_ver" = "$RELEASE_TAG" ] || {
            echo "::error::releases/latest/version is '$meta_ver', expected '$RELEASE_TAG'"
            exit 1
          }

          latest_url=$(curl -fsSIL -o /dev/null -w '%{url_effective}' "https://github.com/${GITHUB_REPOSITORY}/releases/latest")
          [[ "$latest_url" == *"/releases/tag/${RELEASE_TAG}" ]] || {
            echo "::error::releases/latest resolved to '$latest_url', expected '${RELEASE_TAG}'"
            exit 1
          }

          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl -fsSL "${base}/SHA256SUMS" -o "$verify_dir/SHA256SUMS"
          while read -r _sum filename; do
            [ -n "${filename:-}" ] || continue
            echo "Downloading $filename anonymously..."
            curl -fsSL "${base}/${filename}" -o "$verify_dir/${filename}"
          done < "$verify_dir/SHA256SUMS"
          (cd "$verify_dir" && sha256sum -c SHA256SUMS)

          echo "Running sandboxed public Linux installer smoke test..."
          install_home=$(mktemp -d)
          trap 'rm -rf "$verify_dir" "$install_home"' EXIT
          HOME="$install_home" XDG_CONFIG_HOME="$install_home/.config" \
            RAYU_HOME="$install_home/.rayu" RAYU_INSTALL_DIR="$install_home/.local/bin" \
            RAYU_VERSION="$RELEASE_TAG" RAYU_SKIP_SERVER_RELOAD=1 RAYU_NO_TELEMETRY=1 \
            RAYU_SKIP_NPM_CHECK=1 \
            bash -c "curl -fsSL 'https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RELEASE_TAG}/scripts/install.sh' | bash"
          reported=$("$install_home/.local/bin/rayu" --version)
          echo "Installed binary reports: $reported"
          [[ "$reported" == "rayu ${RELEASE_TAG}"* ]] || {
            echo "::error::Expected version starting with 'rayu ${RELEASE_TAG}', got '${reported}'"
            exit 1
          }
