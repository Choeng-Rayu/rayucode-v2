name: Publish VS Code Extension

# Publishes RayuCode.rayucode to the Visual Studio Marketplace.
#
#   git tag vscode-v3.0.0 && git push origin vscode-v3.0.0
#
# The tag must match vscode/extension.manifest.json. Publishing needs the
# repository secret VSCE_PAT (Azure DevOps PAT, Marketplace > Manage scope).
# See how-to-release-vscode.md for the full runbook.

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test, and package without uploading
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

env:
  RAYU_CI: "1"
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Package and publish VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          tag_version="${GITHUB_REF_NAME#vscode-v}"
          manifest_version="$(node -p "require('./vscode/extension.manifest.json').version")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${manifest_version}."
            exit 1
          fi
          echo "Releasing ${manifest_version}."

      - name: Validate manifest and Marketplace state
        # --allow-remote-newer keeps a re-run of an already-published tag green;
        # the upload itself is idempotent via --skip-duplicate.
        run: node scripts/publish_vscode.mjs --preflight-only --allow-remote-newer

      - name: Test extension host and webview
        run: |
          npm test --workspace @rayu-dev/rayucode-vscode
          npm run lint:design --workspace @rayu-dev/rayucode-vscode

      - name: Build and package
        run: npm run package:vscode

      - name: Show packaged files
        run: |
          ls -lh vscode/dist/*.vsix
          unzip -p "$(ls vscode/dist/*.vsix | head -1)" extension.vsixmanifest | head -6

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayucode-vscode-vsix
          path: vscode/dist/*.vsix
          if-no-files-found: error

      - name: Publish to the Marketplace
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set. See how-to-release-vscode.md section 6."
            exit 1
          fi
          node scripts/publish_vscode.mjs --publish --skip-build --allow-remote-newer
