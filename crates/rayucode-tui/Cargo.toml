[package]
name = "rayucode-tui"
version = "0.1.0"
edition = "2024"
publish = false

# Presentation layer for RayuCode: the terminal UI (`tui`) and the offline replay
# `video_export`, extracted out of the monolithic root `rayucode` crate so they
# compile as a separate rustc unit. This crate builds on top of the application
# core (`rayucode-app-core`) and re-exports it via `pub use rayucode_app_core::*`, so
# every existing `crate::<module>` path (e.g. `crate::config`, `crate::server`)
# keeps resolving unchanged across the tui code that was moved here. The root
# `rayucode` crate (cli + bin) in turn re-exports this crate via
# `pub use rayucode_tui::*`.

[lib]
name = "rayucode_tui"
path = "src/lib.rs"

[dependencies]
# Application core (server, agent, provider, auth, session, tool, config, ...).
# Re-exported via `pub use rayucode_app_core::*` in lib.rs. default-features=false
# so this crate (and ultimately the root crate) controls app-core's features.
rayucode-app-core = { path = "../rayucode-app-core", default-features = false }

# Pure math kernels for the idle animations (3D samplers, glyph chooser,
# HSV->RGB). Pinned to opt-level = 3 in all profiles via workspace Cargo.toml so
# the hot trig loops stay optimized even in debug/selfdev builds.
rayucode-tui-anim = { path = "../rayucode-tui-anim" }

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Utilities
anyhow = "1"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"
similar = "2"
tempfile = "3"
open = "5"

# OAuth / hashing helpers used by the login + account UI
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
hex = "0.4"
url = "2"
urlencoding = "2"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-width = "0.2"
unicode-segmentation = "1"

# Presentation-layer workspace crates
rayucode-build-meta = { path = "../rayucode-build-meta" }
rayucode-logging = { path = "../rayucode-logging" }
rayucode-core = { path = "../rayucode-core" }
rayucode-fuzzy = { path = "../rayucode-fuzzy" }
rayucode-config-types = { path = "../rayucode-config-types" }
rayucode-selfdev-types = { path = "../rayucode-selfdev-types" }
rayucode-session-types = { path = "../rayucode-session-types" }
rayucode-provider-core = { path = "../rayucode-provider-core" }
rayucode-tui-markdown = { path = "../rayucode-tui-markdown" }
rayucode-tui-messages = { path = "../rayucode-tui-messages" }
rayucode-tui-core = { path = "../rayucode-tui-core" }
rayucode-tui-mermaid = { path = "../rayucode-tui-mermaid" }
rayucode-tui-account-picker = { path = "../rayucode-tui-account-picker" }
rayucode-tui-render = { path = "../rayucode-tui-render" }
rayucode-tui-visual-debug = { path = "../rayucode-tui-visual-debug" }
rayucode-tui-session-picker = { path = "../rayucode-tui-session-picker", features = ["serde"] }
rayucode-tui-style = { path = "../rayucode-tui-style" }
terminal-colorsaurus = "1.0"
rayucode-tui-permissions = { path = "../rayucode-tui-permissions" }
rayucode-tui-tool-display = { path = "../rayucode-tui-tool-display" }
rayucode-tui-usage-overlay = { path = "../rayucode-tui-usage-overlay" }
rayucode-terminal-image = { path = "../rayucode-terminal-image", features = ["display"] }
rayucode-terminal-prompt = { path = "../rayucode-terminal-prompt" }
rayucode-voice = { path = "../rayucode-voice" }
rayucode-productivity-core = { path = "../rayucode-productivity-core" }
rayucode-tui-workspace = { path = "../rayucode-tui-workspace" }

[features]
default = ["pdf", "bedrock"]
# Exposes bench-only debug helpers (e.g. debug_copy_selection_text_for_bench)
# consumed by the dev `tui_bench` binary in the root crate.
dev-bins = []
# Forwarded to app-core (and onward to rayucode-base) so the root crate's feature
# set fully controls the optional stacks.
jemalloc = ["rayucode-app-core/jemalloc"]
jemalloc-prof = ["rayucode-app-core/jemalloc-prof"]
embeddings = ["rayucode-app-core/embeddings"]
pdf = ["rayucode-app-core/pdf"]
bedrock = ["rayucode-app-core/bedrock"]
linux-compat-vendored-openssl = ["rayucode-app-core/linux-compat-vendored-openssl"]
mmdr-size-api = ["rayucode-tui-mermaid/mmdr-size-api"]
# Forwards the application core's `test-support` feature (and onward to
# rayucode-base) so downstream crates' test targets can reach the whole stack's
# test helpers. Never enabled in normal (non-test) builds.
test-support = ["rayucode-app-core/test-support"]

[dev-dependencies]
# Enables the downstream test-support helpers for *this* crate's own test
# target. Feature unification applies this only to test/bench/example builds.
rayucode-app-core = { path = "../rayucode-app-core", default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"

# Built-in voice input (/voice, Ctrl+Space). macOS and Windows capture natively
# through CoreAudio / WASAPI (system frameworks, like RayuCode Desktop). Linux uses
# an external recorder (pw-record, parecord, arecord, ...) so release builds
# need no ALSA development headers.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rayucode-voice = { path = "../rayucode-voice", features = ["voice-capture"] }
