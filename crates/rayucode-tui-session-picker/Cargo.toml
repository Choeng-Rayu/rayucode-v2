[package]
name = "rayucode-tui-session-picker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rayucode-message-types = { path = "../rayucode-message-types" }
rayucode-session-types = { path = "../rayucode-session-types" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
