[package]
name = "rayucode-harness-api-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Harness API endpoint: bridges versioned API clients onto the internal rayucode protocol"

[dependencies]
anyhow = "1"
rayucode-base = { path = "../rayucode-base", default-features = false }
rayucode-harness-api = { path = "../rayucode-harness-api" }
rayucode-todo-policy = { path = "../rayucode-todo-policy" }
rayucode-session-types = { path = "../rayucode-session-types" }
rayucode-transport = { path = "../rayucode-transport" }
serde = "1"
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
tokio = { version = "1", features = ["net", "io-util", "io-std", "rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The parser in `background_progress` reads markdown produced by the daemon's
# own formatter, so the contract test builds that formatter rather than a copy
# of its output: a change to the wire prose then fails here instead of silently
# turning every client's progress bar off.
rayucode-background-types = { path = "../rayucode-background-types" }

[[bin]]
name = "rayucode-harness-api-bridge"
path = "src/bin/bridge.rs"
