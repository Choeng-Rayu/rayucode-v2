[package]
name = "rayucode-sdk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust SDK for the RayuCode harness API: connect, drive sessions, stream events"

[dependencies]
anyhow = "1"
rayucode-harness-api = { path = "../rayucode-harness-api" }
rayucode-applet-types = { path = "../rayucode-applet-types" }
rayucode-todo-policy = { path = "../rayucode-todo-policy" }
rayucode-provider-metadata = { path = "../rayucode-provider-metadata" }
rayucode-transport = { path = "../rayucode-transport" }
jsonschema = { version = "0.49.3", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
# In-process SSH (feature `ssh-native`), for platforms without an `ssh` binary.
# Keep RSA disabled: native SSH generates Ed25519 keys and uses pinned host keys.
# russh 0.65 migrates the elliptic-curve stack to patched crypto-bigint 0.7.
russh = { version = "0.65", default-features = false, features = ["ring"], optional = true }
rand = { version = "0.10", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util", "macros"], optional = true }

[features]
default = []
# Pure-Rust SSH transport with pinned host keys.
ssh-native = ["dep:russh", "dep:rand", "dep:tokio"]

[dev-dependencies]
