[package]
name = "rayucode-tui-permissions"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "rayucode_tui_permissions"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
rayucode-base = { path = "../rayucode-base", default-features = false }
rayucode-core = { path = "../rayucode-core" }
rayucode-tui-style = { path = "../rayucode-tui-style" }
ratatui = "0.30"
serde_json = "1"
