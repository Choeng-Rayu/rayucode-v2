[package]
name = "rayucode-agent-runtime"
version = "0.1.0"
edition = "2024"

[lib]
name = "rayucode_agent_runtime"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time", "macros"] }
