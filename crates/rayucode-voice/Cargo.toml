[package]
name = "rayucode-voice"
version = "0.1.0"
edition = "2024"
publish = false
description = "Client-side voice for RayuCode: microphone capture, Nari streaming transcription, and configured dictation"

# Client-only. The shared runtime (rayucode-base, rayucode-app-core) and the harness
# server must not depend on this crate: voice needs a microphone and the user's
# desktop session, which a headless or remote server does not have. The TUI,
# CLI, RayuCode Desktop, and the companion process depend on it directly.

[lib]
name = "rayucode_voice"
path = "src/lib.rs"

[dependencies]
rayucode-base = { path = "../rayucode-base", default-features = false, optional = true }
rayucode-provider-env = { path = "../rayucode-provider-env" }
anyhow = { version = "1", optional = true }
base64 = "0.22"
futures = "0.3"
libc = { version = "0.2", optional = true }
regex = "1"
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# Use an explicit bundled-root connector, never the platform filesystem CA loader.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "__rustls-tls"] }
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Native microphone input is opt-in so CLI builds need no audio development libraries.
cpal = { version = "0.15", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# logind session check for background microphone use.
zbus = { version = "5.19", optional = true }
async-io = { version = "2.6", optional = true }

[features]
default = ["desktop-config"]
# Desktop settings, hotkeys, and recorder-process integration.
desktop-config = ["dep:rayucode-base", "dep:serde", "dep:anyhow", "dep:libc", "dep:zbus", "dep:async-io", "tokio/process", "tokio/rt-multi-thread"]
voice-capture = ["desktop-config", "dep:cpal"]

[dev-dependencies]
# Dictation tests use base's cross-crate test helpers (env lock, storage sandbox).
rayucode-base = { path = "../rayucode-base", default-features = false, features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[example]]
name = "voice_startup_profile"
required-features = ["voice-capture"]
