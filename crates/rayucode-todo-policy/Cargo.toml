[package]
name = "rayucode-todo-policy"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure todo quality-gate and auto-poke policy shared by RayuCode clients"

[dependencies]
rayucode-task-types = { path = "../rayucode-task-types" }
rayucode-storage = { path = "../rayucode-storage" }
rayucode-logging = { path = "../rayucode-logging" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
rayucode-core = { path = "../rayucode-core" }
