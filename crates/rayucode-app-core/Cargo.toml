[package]
name = "rayucode-app-core"
version = "0.1.0"
edition = "2024"
publish = false

# Application core for RayuCode: all non-presentation modules (server, agent,
# provider, auth, session, tool, config, etc.) extracted out of the monolithic
# root `rayucode` crate so they compile as a separate rustc unit. The root `rayucode`
# crate (cli + tui + bin) re-exports this crate's modules via `pub use
# rayucode_app_core::*`, preserving every existing `crate::<module>` path.

[lib]
name = "rayucode_app_core"
path = "src/lib.rs"

[dependencies]
# NOTE: the jemalloc allocator stats live in `rayucode-base` (process_memory) and
# local embeddings live in `rayucode-base` (embedding); this crate forwards those
# features to rayucode-base rather than depending on the backing crates directly.

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"

# CLI

# File operations
similar = "2"            # diffing for edits

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"        # URL encoding for web search
uuid = { version = "1", features = ["v4", "v5", "serde"] }
rayucode-applet-types = { path = "../rayucode-applet-types" }

# Embeddings (local inference) live in rayucode-base; this crate forwards the
# `embeddings` feature to rayucode-base rather than depending on rayucode-embedding.
rayucode-harness-api = { path = "../rayucode-harness-api" }
rayucode-productivity-core = { path = "../rayucode-productivity-core" }
rayucode-import-core = { path = "../rayucode-import-core" }

# OAuth
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
url = "2"
qrcode = { version = "0.14.1", default-features = false }
# Local fallback for the open tool when no `rayu companion` is running.
rayucode-desktop-open = { path = "../rayucode-desktop-open" }
rayucode-agent-runtime = { path = "../rayucode-agent-runtime" }
rayucode-ambient-types = { path = "../rayucode-ambient-types" }
rayucode-notify-email = { path = "../rayucode-notify-email" }
rayucode-provider-core = { path = "../rayucode-provider-core" }
rayucode-schema-dialect = { path = "../rayucode-schema-dialect" }
# NOTE: rayucode-app-core does NOT depend on any rayucode-tui-* crate. They were
# unused dead dependency edges here (the TUI declares them itself). Removing
# them stops a rayucode-tui-* edit from cascading a recompile through app-core.
rayucode-update-core = { path = "../rayucode-update-core" }

# Streaming
tokio-stream = "0.1"

# NOTE: no ratatui/crossterm here. Terminal rendering and prompts belong to the
# CLI and rayucode-tui, so the shared runtime never touches a terminal.

# PDF parsing (behind feature flag)
rayucode-pdf = { path = "../rayucode-pdf", optional = true }
rayucode-build-support = { path = "../rayucode-build-support" }
rayucode-build-meta = { path = "../rayucode-build-meta" }

# Foundational layer (provider, auth, config, session, message, memory, ...).
# Re-exported via `pub use rayucode_base::*` in lib.rs. default-features=false so
# this crate controls rayucode-base's optional features (see [features] below).
rayucode-base = { path = "../rayucode-base", default-features = false }
rayucode-command-risk = { path = "../rayucode-command-risk" }
rayucode-core = { path = "../rayucode-core" }
rayucode-message-types = { path = "../rayucode-message-types" }
rayucode-overnight-core = { path = "../rayucode-overnight-core" }
rayucode-plan = { path = "../rayucode-plan" }
rayucode-swarm-core = { path = "../rayucode-swarm-core" }
rayucode-selfdev-types = { path = "../rayucode-selfdev-types" }
rayucode-session-types = { path = "../rayucode-session-types" }
rayucode-setup-hints = { path = "../rayucode-setup-hints" }
rayucode-task-types = { path = "../rayucode-task-types" }
rayucode-tool-core = { path = "../rayucode-tool-core" }
rayucode-codemode = { path = "../rayucode-codemode" }
rayucode-tool-types = { path = "../rayucode-tool-types" }

# Archive extraction (for auto-update)
flate2 = "1"
tar = "0.4"
tempfile = "3"
agentgrep = { git = "https://github.com/1jehuang/agentgrep.git", tag = "v0.2.0" }

[features]
default = ["pdf", "bedrock"]
# jemalloc allocator stats live in rayucode-base (process_memory); forward there.
jemalloc = ["rayucode-base/jemalloc"]
jemalloc-prof = ["rayucode-base/jemalloc-prof"]
# local embeddings live in rayucode-base (embedding); forward there.
embeddings = ["rayucode-base/embeddings"]
# live AWS Bedrock support lives in rayucode-base (provider/bedrock); forward there.
bedrock = ["rayucode-base/bedrock"]
# Used only by the CentOS 7 portable Linux release build.
linux-compat-vendored-openssl = ["rayucode-notify-email/linux-compat-vendored-openssl"]
# PDF text extraction lives in this crate (tool/read.rs).
pdf = ["dep:rayucode-pdf"]
# Compiles this crate's test-only helpers/accessors (e.g. the
# ExternalAuthReviewCandidate read accessors) as `pub` and forwards
# rayucode-base's `test-support` so downstream crates' test targets can reach the
# whole stack's helpers. Never enabled in normal (non-test) builds.
test-support = ["rayucode-base/test-support"]

[dev-dependencies]
# The application consumes a corpus registered by the executable. Only its
# own documentation tests need to embed the real corpus directly.
rayucode-docs-data = { path = "../rayucode-docs-data" }
# Paused-time browser tests must compile when this package is tested alone,
# without inheriting test-util from another workspace package's dev-dependencies.
tokio = { version = "1", features = ["test-util"] }
# Used by async streaming tests (ambient/runner_tests, server/client_actions_tests).
async-stream = "0.3"
# Enables rayucode-base's test-support helpers (storage::lock_test_env,
# auth::test_sandbox, bus::reset_models_updated_publish_state_for_tests) for
# *this* crate's own test target. Feature unification applies this only to
# test/bench/example builds, not to a normal `cargo build`.
rayucode-base = { path = "../rayucode-base", default-features = false, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
# Native desktop control for the `macos_computer_use` tool (synthetic mouse/keyboard
# events, cursor positioning, display bounds). `highsierra` enables the
# CGEventCreateScrollWheelEvent2 binding used for scroll.
core-graphics = { version = "0.23", features = ["highsierra"] }
