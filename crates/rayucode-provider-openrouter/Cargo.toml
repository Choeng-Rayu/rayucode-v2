[package]
name = "rayucode-provider-openrouter"
version = "0.1.0"
edition = "2024"

[dependencies]
rayucode-schema-dialect = { path = "../rayucode-schema-dialect" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
futures = "0.3"
rayucode-core = { path = "../rayucode-core" }
rayucode-logging = { path = "../rayucode-logging" }
rayucode-message-types = { path = "../rayucode-message-types" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
