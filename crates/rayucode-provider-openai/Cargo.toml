[package]
name = "rayucode-provider-openai"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
rayucode-core = { path = "../rayucode-core" }
rayucode-logging = { path = "../rayucode-logging" }
rayucode-message-types = { path = "../rayucode-message-types" }
rayucode-provider-core = { path = "../rayucode-provider-core" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
