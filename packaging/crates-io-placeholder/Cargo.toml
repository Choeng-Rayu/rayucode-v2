[package]
name = "rayucode"
version = "0.0.1"
edition = "2021"
description = "RayuCode coding agent. This crate reserves the name; install the real binary from https://rayucode.com"
license = "MIT"
repository = "https://github.com/Choeng-Rayu/rayucode"
homepage = "https://rayucode.com"
readme = "README.md"
keywords = ["ai", "agent", "coding", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rayu"
path = "src/main.rs"

# Standalone package, not part of the main rayucode workspace.
[workspace]
